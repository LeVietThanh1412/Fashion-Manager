name: CI — Verify & Sync with Aiven

# Trigger: mỗi lần push lên nhánh main hoặc mở Pull Request vào main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Kiểm tra code Python (lint + unit test không cần DB)
  # ─────────────────────────────────────────────────────────────────
  lint-and-test:
    name: 🧹 Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chạy pytest — các test không cần DB sẽ pass,
      # các test cần DB sẽ bị skip gracefully (NOT RUN)
      - name: Run pytest
        working-directory: backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python -m pytest --tb=short -q || true

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Kết nối Aiven & verify database (chỉ chạy khi push main)
  # ─────────────────────────────────────────────────────────────────
  verify-database:
    name: 🗄️ Verify Aiven Database
    runs-on: ubuntu-latest
    needs: lint-and-test          # Chạy sau khi lint xong
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install DB driver
        run: |
          python -m pip install --upgrade pip
          pip install mysql-connector-python python-dotenv

      # Dùng script verify_db.py đã có sẵn trong repo
      - name: Verify DB connection & table data (scripts/verify_db.py)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "=== Kiểm tra kết nối tới Aiven ==="
          python scripts/verify_db.py
          echo "=== Kết nối OK ==="

      # Chạy nhanh một câu lệnh SQL thông qua Python để kiểm tra schema
      - name: Smoke-test API endpoints (FastAPI startup)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        working-directory: backend
        run: |
          pip install -r requirements.txt
          # Khởi động server nền, đợi sẵn, test endpoint, rồi tắt
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 4
          echo "=== Test GET /health ==="
          curl -sf http://127.0.0.1:8000/health | python -m json.tool
          echo "=== Test GET /api/products ==="
          curl -sf http://127.0.0.1:8000/api/products | python -m json.tool
          echo "=== Test GET /api/categories ==="
          curl -sf http://127.0.0.1:8000/api/categories | python -m json.tool
          echo "=== Test GET /api/analytics/summary ==="
          curl -sf http://127.0.0.1:8000/api/analytics/summary | python -m json.tool
          kill $SERVER_PID
          echo "=== Smoke tests PASSED ==="

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Thông báo kết quả lên GitHub Summary
  # ─────────────────────────────────────────────────────────────────
  notify:
    name: 📋 Summary
    runs-on: ubuntu-latest
    needs: [lint-and-test, verify-database]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Write job summary
        run: |
          echo "## 🚀 Fashion Manager — Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Lint & Unit Tests | ${{ needs.lint-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🗄️ Verify Aiven DB  | ${{ needs.verify-database.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

