name: Verify Aiven database

# Read-only integration checks are separate from static frontend deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME || vars.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER || vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      APP_CORS_ORIGINS: ${{ secrets.APP_CORS_ORIGINS || vars.APP_CORS_ORIGINS || 'https://levietthanh1412.github.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Validate secrets and install optional Aiven CA
        env:
          DB_SSL_CA_CERT: ${{ secrets.DB_SSL_CA_CERT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          required = ('DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASSWORD')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Secrets/Variables: ' + ', '.join(missing))
          certificate = os.environ.get('DB_SSL_CA_CERT', '')
          if certificate:
              ca = Path(os.environ['RUNNER_TEMP']) / 'aiven-ca.pem'
              ca.write_text(certificate, encoding='utf-8')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write(f'DB_SSL_CA={ca}\n')
          else:
              print('CA not provided: TLS encryption required; add DB_SSL_CA_CERT to verify server identity.')
          PY
      - name: Check DNS, connection and schema (read only)
        run: python scripts/verify_db.py
      - name: Smoke-test API against Aiven (read only)
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app
          with TestClient(app) as client:
              for path in ('/health', '/api/health/db', '/api/products', '/api/categories', '/api/stores', '/api/analytics/summary'):
                  response = client.get(path)
                  response.raise_for_status()
                  print(f'PASS: {path}')
          PY
